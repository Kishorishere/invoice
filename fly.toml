# fly.toml app configuration file generated for invoice-extractor-glimmering-breeze-573 on 2026-11-17T08:31:18+05:45
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'invoice-extractor-glimmering-breeze-573'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'

[env]
  COOKIE_SECURE = 'true'
  CORS_ORIGINS = ''
  DATABASE_URL = 'sqlite:////app/data/app.db'
  STATIC_DIR = '/app/static'
  UPLOAD_DIR = '/app/data/uploads'

[[mounts]]
  source = 'invoice_data'
  destination = '/app/data'

[http_service]
  internal_port = 3004
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
