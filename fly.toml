# Fly.io config. Run `fly launch --no-deploy` once to attach to your account,
# then `fly deploy`. See README for the full walk-through.

app = "invoice-extractor"        # rename after `fly launch`
primary_region = "fra"            # Frankfurt — close to Deutschelink / GDPR region

[build]
  dockerfile = "Dockerfile"

[env]
  STATIC_DIR = "/app/static"
  UPLOAD_DIR = "/app/data/uploads"
  DATABASE_URL = "sqlite:////app/data/app.db"
  CORS_ORIGINS = ""
  # Fly serves over HTTPS — the session cookie should refuse HTTP.
  COOKIE_SECURE = "true"

[[mounts]]
  source = "invoice_data"
  destination = "/app/data"

[http_service]
  internal_port = 3004
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[deploy]
  strategy = "rolling"
